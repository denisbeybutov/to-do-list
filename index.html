<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>To do list</title>
</head>
<body>
    <div class="wrapper">
        <main class="main">
            <h1 class="main__header">To do list</h1>
            <div class="main__form">
                <label for="main__search"></label>
                <input class="main__input" type="search" id="main__search" placeholder="Search note...">
                <img class="main__magnifier" src="./icons/magnifier.svg" alt="magnifier">
                <button class="main__button-choose button">
                    <p>All</p>
                    <ul class="button-choose__list hidden">
                        <li class="button-choose__item all">All</li>
                        <li class="button-choose__item complete">Complete</li>
                        <li class="button-choose__item incomplete">Incomplete</li>
                    </ul>
                    <img class="button-choose__img bottom" src="./icons/arrow-bottom.svg" alt="">
                    <img class="button-choose__img top hidden" src="./icons/arrow-top.svg" alt="">
                </button>
                <button class="main__button-theme button">
                    <img src="./icons/white-theme.svg" alt="white theme button">
                </button>
            </div>
            <ul class="list">

                <li class="list__item">
                    <div class="list__wrapper-note">
                        
                        <input class="list__checkbox" type="checkbox" id="checkbox1">
                        
                        <input class="list__input-text" type="text" value="Reading book" disabled>
                    </div>
                    <div class="list__wrapper-change">
                        <img class="list__icon edit" src="./icons/change.svg" alt="" width="13px">
                        <img class="list__icon delete" src="./icons/trash.svg" alt="" width="18px">
                    </div>
                    <div class="list__wrapper-edit hidden">
                        <img class="list__icon end-edit" src="./icons/check2.svg" width="17px" alt="">
                        <img class="list__icon reset" src="./icons/close.svg" width="17px" alt="">
                    </div>
                </li>

                <li class="list__item">
                    <div class="list__wrapper-note">
                        
                        <input class="list__checkbox" type="checkbox" id="checkbox2">
                        
                        <input class="list__input-text" type="text" value="Yoga training" disabled>
                    </div>
                    <div class="list__wrapper-change ">
                        <img class="list__icon edit" src="./icons/change.svg" alt="" width="13px">
                        <img class="list__icon delete" src="./icons/trash.svg" alt="" width="18px">
                    </div>
                    <div class="list__wrapper-edit hidden">
                        <img class="list__icon end-edit" src="./icons/check2.svg" width="17px" alt="">
                        <img class="list__icon reset" src="./icons/close.svg" width="17px" alt="">
                    </div>
                </li>

                <li class="list__item">
                    <div class="list__wrapper-note">
                        
                        <input class="list__checkbox" type="checkbox" id="checkbox3">
                       
                        <input class="list__input-text" type="text" value="Write the 'TO DO LIST' in JavaScript" disabled>
                    </div>
                    <div class="list__wrapper-change ">
                        <img class="list__icon edit" src="./icons/change.svg" alt="" width="13px">
                        <img class="list__icon delete" src="./icons/trash.svg" alt="" width="18px">
                    </div>
                    <div class="list__wrapper-edit hidden">
                        <img class="list__icon end-edit" src="./icons/check2.svg" width="17px" alt="">
                        <img class="list__icon reset" src="./icons/close.svg" width="17px" alt="">
                    </div>
                </li>
                
            </ul>
            <div class="empty hidden">
                <img src="./img/empty2.png" alt="" class="empty__img ">
                <p class="empty__text">Empty...</p>
            </div>
            
            
        </main>
        <footer class="footer">
            <button class="footer__button button">
                <img src="./icons/footer-button.svg" alt="">
            </button>
        </footer>
        
    </div>

    <div class="wrapper-modal hidden">
        <div class="modal">
            <div class="modal__header">
                <h2 class="modal__header-text">New note</h2>
                <input type="text" class="modal__header-input" placeholder="Input your note...">
            </div>
            <div class="modal__button">
                <button class="modal__button-cancel">Cancel</button>
                <button class="modal__button-apply">Apply</button>
            </div>
        </div>
    </div>
    
    <script src="./script.js"></script>
</body>
</html>
